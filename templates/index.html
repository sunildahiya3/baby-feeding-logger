<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Feeding Logger</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --primary: #0284c7;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary);
            flex: 1;
            text-align: center;
        }
        .btn-logout {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #64748b;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .radio-card {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
        .radio-card input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
        }
        .measurement {
            display: none;
            margin: -8px 0 16px 30px;
        }
        .measurement label {
            display: block;
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
        .measurement input, .filter-select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .date-time-fields, .date-range-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .date-time-fields label, .date-range-fields label {
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: #64748b;
            font-size: 0.85rem;
        }
        .filter-select {
            margin: 0 0 8px;
        }
        .chart-panel {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }
        .chart-panel h2 {
            font-size: 1rem;
            margin: 0 0 10px;
        }
        .chart-wrapper {
            position: relative;
            height: 220px;
        }
        .empty-state {
            color: #64748b;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px 0;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        th {
            background-color: #f1f5f9;
        }
        .badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Avli's Baby's Daily Records</h1>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('logTab', event)">Log Feed</button>
        <button class="tab-btn" onclick="switchTab('recordsTab', event)">Raw Data</button>
        <button class="tab-btn" onclick="switchTab('graphsTab', event)">Graphs</button>
    </div>

    <!-- TAB 1: LOG FEED -->
    <div id="logTab" class="tab-content active">
        <form id="feedForm">
            <div class="date-time-fields">
                <label for="eventDate">Date<input id="eventDate" type="date" value="{{ default_date }}" required></label>
                <label for="eventTime">Time<input id="eventTime" type="time" value="{{ default_time }}" required></label>
            </div>
            <div class="radio-group">
                <label class="radio-card">
                    <input type="radio" name="feed_type" value="Breast Milk" checked>
                    <span>Breast Milk</span>
                </label>
                <div id="durationField" class="measurement">
                    <label for="durationMinutes">Duration (minutes)</label>
                    <input id="durationMinutes" type="number" min="1" step="1" placeholder="e.g. 20">
                </div>
                <label class="radio-card">
                    <input type="radio" name="feed_type" value="Formula Milk">
                    <span>Formula Milk</span>
                </label>
                <div id="formulaQuantityField" class="measurement">
                    <label for="formulaQuantityMl">Volume (ml)</label>
                    <input id="formulaQuantityMl" type="number" min="1" step="1" placeholder="e.g. 120">
                </div>
                <label class="radio-card">
                    <input type="radio" name="feed_type" value="Pumped Milk">
                    <span>Pumped Milk</span>
                </label>
                <div id="pumpedQuantityField" class="measurement">
                    <label for="pumpedQuantityMl">Quantity (ml)</label>
                    <input id="pumpedQuantityMl" type="number" min="1" step="1" placeholder="e.g. 90">
                </div>
                <label class="radio-card">
                    <input type="radio" name="feed_type" value="Calcium">
                    <span>Calcium</span>
                </label>
                <div id="calciumQuantityField" class="measurement">
                    <label for="calciumQuantityMl">Dose (ml)</label>
                    <input id="calciumQuantityMl" type="number" min="1" step="1" placeholder="e.g. 5">
                </div>
                <label class="radio-card">
                    <input type="radio" name="feed_type" value="Sun Sip">
                    <span>Sun Sip</span>
                </label>
                <div id="sunSipQuantityField" class="measurement">
                    <label for="sunSipQuantityMl">Dose (ml)</label>
                    <input id="sunSipQuantityMl" type="number" min="1" step="1" placeholder="e.g. 5">
                </div>
                <label class="radio-card">
                    <input type="radio" name="feed_type" value="Urination">
                    <span>Urination</span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="feed_type" value="Potty">
                    <span>Potty</span>
                </label>
            </div>
            <button type="submit" class="btn-submit">Record (IST)</button>
        </form>
    </div>

    <!-- TAB 2: RAW DATA -->
    <div id="recordsTab" class="tab-content">
        <div class="date-range-fields">
            <label for="startDate">From<input id="startDate" type="date" onchange="renderRecords()"></label>
            <label for="endDate">To<input id="endDate" type="date" onchange="renderRecords()"></label>
        </div>
        <select id="typeFilter" class="filter-select" aria-label="Filter records by type" onchange="renderRecords()">
            <option value="all">All types</option>
        </select>
        <table>
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Date (DD MM YYYY)</th>
                    <th>Time (HH MM IST)</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody id="recordsBody">
                <!-- Records render dynamically -->
            </tbody>
        </table>
    </div>

    <!-- TAB 3: GRAPHS -->
    <div id="graphsTab" class="tab-content">
        <div class="date-range-fields">
            <label for="graphStartDate">From<input id="graphStartDate" type="date" onchange="renderGraphs()"></label>
            <label for="graphEndDate">To<input id="graphEndDate" type="date" onchange="renderGraphs()"></label>
        </div>
        <div id="chartsContainer"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<script>
function switchTab(tabId, event) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    if (event) event.target.classList.add('active');

    if (tabId === 'recordsTab') {
        loadRecords();
    }
    if (tabId === 'graphsTab') {
        loadGraphs();
    }
}

document.getElementById('feedForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const feedType = document.querySelector('input[name="feed_type"]:checked').value;
    const body = { feed_type: feedType, date: document.getElementById('eventDate').value, time: document.getElementById('eventTime').value };
    if (feedType === 'Breast Milk') body.duration_minutes = document.getElementById('durationMinutes').value;
    if (feedType === 'Formula Milk') body.quantity_ml = document.getElementById('formulaQuantityMl').value;
    if (feedType === 'Pumped Milk') body.quantity_ml = document.getElementById('pumpedQuantityMl').value;
    if (feedType === 'Calcium') body.quantity_ml = document.getElementById('calciumQuantityMl').value;
    if (feedType === 'Sun Sip') body.quantity_ml = document.getElementById('sunSipQuantityMl').value;

    const response = await fetch('/api/feed', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });

    if (response.ok) {
        alert('Feeding logged in IST!');
        switchTab('recordsTab');
    } else {
        const error = await response.json();
        alert(error.message || 'Unable to record event');
    }
});

document.querySelectorAll('input[name="feed_type"]').forEach(input => input.addEventListener('change', updateMeasurementFields));

function updateMeasurementFields() {
    const feedType = document.querySelector('input[name="feed_type"]:checked').value;
    document.getElementById('durationField').style.display = feedType === 'Breast Milk' ? 'block' : 'none';
    document.getElementById('formulaQuantityField').style.display = feedType === 'Formula Milk' ? 'block' : 'none';
    document.getElementById('pumpedQuantityField').style.display = feedType === 'Pumped Milk' ? 'block' : 'none';
    document.getElementById('calciumQuantityField').style.display = feedType === 'Calcium' ? 'block' : 'none';
    document.getElementById('sunSipQuantityField').style.display = feedType === 'Sun Sip' ? 'block' : 'none';
}

let allRecords = [];
let charts = [];

async function loadRecords() {
    const response = await fetch('/api/records');
    const records = await response.json();
    allRecords = records;
    const filter = document.getElementById('typeFilter');
    const selectedType = filter.value;
    filter.innerHTML = '<option value="all">All types</option>';
    [...new Set(records.map(row => row.feed_type))].forEach(type => {
        filter.innerHTML += `<option value="${type}">${type}</option>`;
    });
    filter.value = [...new Set(records.map(row => row.feed_type))].includes(selectedType) ? selectedType : 'all';
    renderRecords();
}

function renderRecords() {
    const tbody = document.getElementById('recordsBody');
    tbody.innerHTML = '';
    const selectedType = document.getElementById('typeFilter').value;
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const records = allRecords.filter(row => {
        const [day, month, year] = row.date.split(' ');
        const recordDate = `${year}-${month}-${day}`;
        return (selectedType === 'all' || row.feed_type === selectedType) &&
            (!startDate || recordDate >= startDate) && (!endDate || recordDate <= endDate);
    });

    records.forEach(row => {
        const details = row.duration_minutes ? `${row.duration_minutes} min` : row.quantity_ml ? `${row.quantity_ml} ml` : '-';
        tbody.innerHTML += `
            <tr>
                <td><span class="badge">${row.feed_type}</span></td>
                <td>${row.date}</td>
                <td>${row.time}</td>
                <td>${details}</td>
            </tr>
        `;
    });
}

async function loadGraphs() {
    if (!allRecords.length) {
        const response = await fetch('/api/records');
        allRecords = await response.json();
    }
    renderGraphs();
}

function renderGraphs() {
    charts.forEach(chart => chart.destroy());
    charts = [];
    const container = document.getElementById('chartsContainer');
    container.innerHTML = '';
    const startDate = document.getElementById('graphStartDate').value;
    const endDate = document.getElementById('graphEndDate').value;
    const colors = {
        'Breast Milk': '#0284c7',
        'Formula Milk': '#f97316',
        'Pumped Milk': '#16a34a',
        'Calcium': '#db2777',
        'Sun Sip': '#ca8a04',
        'Urination': '#7c3aed',
        'Potty': '#dc2626'
    };
    const records = allRecords.filter(row => {
        const [day, month, year] = row.date.split(' ');
        const recordDate = `${year}-${month}-${day}`;
        return (!startDate || recordDate >= startDate) && (!endDate || recordDate <= endDate);
    });
    if (!records.length) {
        container.innerHTML = '<div class="empty-state">No records found for this date range.</div>';
        return;
    }

    const panel = document.createElement('section');
    panel.className = 'chart-panel';
    panel.innerHTML = '<h2>All records</h2><div class="chart-wrapper"><canvas></canvas></div>';
    container.appendChild(panel);

    const sortedRecords = [...records].reverse();
    const timestamps = [...new Set(sortedRecords.map(row => `${row.date} ${row.time}`))];
    const types = [...new Set(sortedRecords.map(row => row.feed_type))];
    const formatTimestamp = timestamp => {
        const [day, month, year, hour, minute] = timestamp.split(/[ :]/);
        const date = new Date(Number(year), Number(month) - 1, Number(day));
        const monthName = date.toLocaleString('en-US', { month: 'short' });
        const suffix = day % 10 === 1 && day !== '11' ? 'st' : day % 10 === 2 && day !== '12' ? 'nd' : day % 10 === 3 && day !== '13' ? 'rd' : 'th';
        return `${Number(day)}${suffix} ${monthName} ${year} ${hour}:${minute}`;
    };
    const datasets = types.filter(type => ['Formula Milk', 'Pumped Milk', 'Calcium', 'Sun Sip'].includes(type)).map(type => ({
        label: type,
        data: timestamps.map(timestamp => {
            const record = sortedRecords.find(row => row.feed_type === type && `${row.date} ${row.time}` === timestamp);
            return record ? record.quantity_ml : null;
        }),
        borderColor: colors[type],
        backgroundColor: colors[type],
        yAxisID: 'ml',
        tension: 0.25,
        pointRadius: 4,
        spanGaps: true
    }));
    datasets.push({
        label: 'Instances',
        data: timestamps.map(timestamp => sortedRecords.filter(row => `${row.date} ${row.time}` === timestamp).length),
        borderColor: '#475569',
        backgroundColor: '#475569',
        yAxisID: 'instances',
        tension: 0.25,
        pointRadius: 4,
        stepped: true
    });

    charts.push(new Chart(panel.querySelector('canvas'), {
        type: 'line',
        data: { labels: timestamps.map(formatTimestamp), datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                ml: { beginAtZero: true, position: 'left', title: { display: true, text: 'Volume (ml)' } },
                instances: { beginAtZero: true, position: 'right', title: { display: true, text: 'Number of instances' }, grid: { drawOnChartArea: false }, ticks: { precision: 0 } },
                x: { ticks: { maxRotation: 45, minRotation: 0 } }
            },
            plugins: { legend: { display: true, position: 'bottom' } }
        }
    }));
}

updateMeasurementFields();

async function logout() {
    await fetch('/logout', { method: 'POST' });
    window.location.reload();
}
</script>

</body>
</html>
