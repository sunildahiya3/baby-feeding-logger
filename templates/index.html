<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Feeding Logger</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --primary: #0284c7;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary);
            flex: 1;
            text-align: center;
        }
        .btn-logout {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #64748b;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .radio-card {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
        .radio-card input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
        }
        .measurement {
            display: none;
            margin: -8px 0 16px 30px;
        }
        .measurement label {
            display: block;
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
        .measurement input, .filter-select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .date-time-fields, .date-range-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .date-time-fields label, .date-range-fields label {
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: #64748b;
            font-size: 0.85rem;
        }
        .filter-select {
            margin: 0 0 8px;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        th {
            background-color: #f1f5f9;
        }
        .badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Avli's Baby's Daily Records</h1>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('logTab', event)">Log Feed</button>
        <button class="tab-btn" onclick="switchTab('recordsTab', event)">Records</button>
    </div>

    <!-- TAB 1: LOG FEED -->
    <div id="logTab" class="tab-content active">
        <form id="feedForm">
            <div class="date-time-fields">
                <label for="eventDate">Date<input id="eventDate" type="date" value="{{ default_date }}" required></label>
                <label for="eventTime">Time<input id="eventTime" type="time" value="{{ default_time }}" required></label>
            </div>
            <div class="radio-group">
                <label class="radio-card">
                    <input type="radio" name="feed_type" value="Breast Milk" checked>
                    <span>Breast Milk</span>
                </label>
                <div id="durationField" class="measurement">
                    <label for="durationMinutes">Duration (minutes)</label>
                    <input id="durationMinutes" type="number" min="1" step="1" placeholder="e.g. 20">
                </div>
                <label class="radio-card">
                    <input type="radio" name="feed_type" value="Formula Milk">
                    <span>Formula Milk</span>
                </label>
                <div id="formulaQuantityField" class="measurement">
                    <label for="formulaQuantityMl">Volume (ml)</label>
                    <input id="formulaQuantityMl" type="number" min="1" step="1" placeholder="e.g. 120">
                </div>
                <label class="radio-card">
                    <input type="radio" name="feed_type" value="Pumped Milk">
                    <span>Pumped Milk</span>
                </label>
                <div id="pumpedQuantityField" class="measurement">
                    <label for="pumpedQuantityMl">Quantity (ml)</label>
                    <input id="pumpedQuantityMl" type="number" min="1" step="1" placeholder="e.g. 90">
                </div>
                <label class="radio-card">
                    <input type="radio" name="feed_type" value="Urination">
                    <span>Urination</span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="feed_type" value="Potty">
                    <span>Potty</span>
                </label>
            </div>
            <button type="submit" class="btn-submit">Record (IST)</button>
        </form>
    </div>

    <!-- TAB 2: RECORDS -->
    <div id="recordsTab" class="tab-content">
        <div class="date-range-fields">
            <label for="startDate">From<input id="startDate" type="date" onchange="renderRecords()"></label>
            <label for="endDate">To<input id="endDate" type="date" onchange="renderRecords()"></label>
        </div>
        <select id="typeFilter" class="filter-select" aria-label="Filter records by type" onchange="renderRecords()">
            <option value="all">All types</option>
        </select>
        <table>
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Date (DD MM YYYY)</th>
                    <th>Time (HH MM IST)</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody id="recordsBody">
                <!-- Records render dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script>
function switchTab(tabId, event) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    if (event) event.target.classList.add('active');

    if (tabId === 'recordsTab') {
        loadRecords();
    }
}

document.getElementById('feedForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const feedType = document.querySelector('input[name="feed_type"]:checked').value;
    const body = { feed_type: feedType, date: document.getElementById('eventDate').value, time: document.getElementById('eventTime').value };
    if (feedType === 'Breast Milk') body.duration_minutes = document.getElementById('durationMinutes').value;
    if (feedType === 'Formula Milk') body.quantity_ml = document.getElementById('formulaQuantityMl').value;
    if (feedType === 'Pumped Milk') body.quantity_ml = document.getElementById('pumpedQuantityMl').value;

    const response = await fetch('/api/feed', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });

    if (response.ok) {
        alert('Feeding logged in IST!');
        switchTab('recordsTab');
    } else {
        const error = await response.json();
        alert(error.message || 'Unable to record event');
    }
});

document.querySelectorAll('input[name="feed_type"]').forEach(input => input.addEventListener('change', updateMeasurementFields));

function updateMeasurementFields() {
    const feedType = document.querySelector('input[name="feed_type"]:checked').value;
    document.getElementById('durationField').style.display = feedType === 'Breast Milk' ? 'block' : 'none';
    document.getElementById('formulaQuantityField').style.display = feedType === 'Formula Milk' ? 'block' : 'none';
    document.getElementById('pumpedQuantityField').style.display = feedType === 'Pumped Milk' ? 'block' : 'none';
}

let allRecords = [];

async function loadRecords() {
    const response = await fetch('/api/records');
    const records = await response.json();
    allRecords = records;
    const filter = document.getElementById('typeFilter');
    const selectedType = filter.value;
    filter.innerHTML = '<option value="all">All types</option>';
    [...new Set(records.map(row => row.feed_type))].forEach(type => {
        filter.innerHTML += `<option value="${type}">${type}</option>`;
    });
    filter.value = [...new Set(records.map(row => row.feed_type))].includes(selectedType) ? selectedType : 'all';
    renderRecords();
}

function renderRecords() {
    const tbody = document.getElementById('recordsBody');
    tbody.innerHTML = '';
    const selectedType = document.getElementById('typeFilter').value;
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const records = allRecords.filter(row => {
        const [day, month, year] = row.date.split(' ');
        const recordDate = `${year}-${month}-${day}`;
        return (selectedType === 'all' || row.feed_type === selectedType) &&
            (!startDate || recordDate >= startDate) && (!endDate || recordDate <= endDate);
    });

    records.forEach(row => {
        const details = row.duration_minutes ? `${row.duration_minutes} min` : row.quantity_ml ? `${row.quantity_ml} ml` : '-';
        tbody.innerHTML += `
            <tr>
                <td><span class="badge">${row.feed_type}</span></td>
                <td>${row.date}</td>
                <td>${row.time}</td>
                <td>${details}</td>
            </tr>
        `;
    });
}

updateMeasurementFields();

async function logout() {
    await fetch('/logout', { method: 'POST' });
    window.location.reload();
}
</script>

</body>
</html>
